<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sensor Charades v1.10</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            user-select: none; 
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }

        #word-display {
            font-size: 5rem;
            font-weight: bold;
            padding: 20px;
            text-transform: uppercase;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
        }

        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: #f39c12;
        }

        #sensor-status {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #e74c3c;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        #game-over-screen h2 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .list-container {
            width: 90%;
            max-width: 600px;
            text-align: left;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .word-list {
            font-size: 0.85rem; 
            white-space: nowrap; 
            overflow-x: auto; 
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin: 0;
            -webkit-overflow-scrolling: touch; 
        }

        .correct-color { color: #2ecc71; }
        .pass-color { color: #e74c3c; }

        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .correct { background-color: #2ecc71 !important; }
        .pass { background-color: #e74c3c !important; }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1>SENSOR CHARADES</h1>
        <p>Hold phone to forehead in Landscape.</p>
        <p>Tilt UP (Ceiling) for Correct | Tilt DOWN (Floor) to Pass</p>
        <button onclick="startGame()">START GAME</button>
        <div style="position: absolute; bottom: 10px; font-size: 0.8rem; color: #7f8c8d;">v1.10</div>

        <div class="list-container">

        <div class="list-container">
            <div class="list-title pass-color">Skipped:</div>
            <div id="skipped-list" class="word-list pass-color"></div>
        </div>

        <button onclick="location.reload()">PLAY AGAIN</button>

OKAmiDDgMOJwpBI4oCiwrVXGUnCojhHxbjCtVDDjcK3w7/DvcKuw557RUrD");

        function playSound(type) {
            if (type === 'correct') {
                soundCorrect.currentTime = 0;
                soundCorrect.play().catch(e => console.log("Audio play blocked", e));
            } else {
                soundPass.currentTime = 0;
                soundPass.play().catch(e => console.log("Audio play blocked", e));
            }
        }

        function nextWord() {
            if (words.length === 0) return "Game Over!";
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words.splice(randomIndex, 1)[0]; 
            wordDisplay.innerText = currentWord;
            isProcessing = false; 
        }

        function handleGuess(type) {
            if (isProcessing) return;
            isProcessing = true;
            isNeutral = false; 

            if (type === 'correct') {
                score++;
                correctWordsList.push(currentWord); 
                scoreDisplay.innerText = `Score: ${score}`;
                container.classList.add('correct');
                playSound('correct');
            } else {
                skippedWordsList.push(currentWord); 
                container.classList.add('pass');
                playSound('pass');
            }

            setTimeout(() => {
                container.classList.remove('correct', 'pass');
                nextWord();
            }, 500);
        }

        function handleMotion(event) {
            let z = event.accelerationIncludingGravity ? event.accelerationIncludingGravity.z : null;
            
            if (!sensorsConfirmed && z !== null) {
                sensorsConfirmed = true;
                sensorStatus.innerText = "Sensors: Active!";
                sensorStatus.style.color = "#2ecc71";
            }

            if (!gameActive || isProcessing || z === null) return; 

            // The neutral zone is between -4 and 4 (mostly upright)
            if (Math.abs(z) < 4) {
                isNeutral = true;
            } 
            // INCREASED SENSITIVITY THRESHOLD: Was 6, now 7.5 (requires steeper tilt)
            else if (z > 7.5 && isNeutral) {
                handleGuess('correct');
            } else if (z < -7.5 && isNeutral) {
                handleGuess('pass');
            }
        }

        async function startGame() {

// --- ADD THIS BLOCK TO UNLOCK AUDIO ---
            soundCorrect.play().catch(e => {});
            soundCorrect.pause();
            soundCorrect.currentTime = 0;

            soundPass.play().catch(e => {});
            soundPass.pause();
            soundPass.currentTime = 0;
            // --------------------------------------

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') return alert("Sensor Permission Denied!");
                } catch (e) { console.error(e); }
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            let countdown = 3;
            wordDisplay.innerText = countdown;
            timerDisplay.innerText = `Time: 40`;
            timerDisplay.style.color = '#f39c12';
            
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    wordDisplay.innerText = countdown;
                } else if (countdown === 0) {
                    wordDisplay.innerText = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    startActualGame();
                }
            }, 1000);
        }

        function startActualGame() {
            score = 0;
            timeLeft = 40; 
            gameActive = true;
            isNeutral = false; 
            
            correctWordsList = [];
            skippedWordsList = [];
            
            scoreDisplay.innerText = `Score: ${score}`;
            nextWord();

            window.addEventListener('devicemotion', handleMotion);

            const timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `Time: ${timeLeft}`;
                
                if (timeLeft <= 5) {
                    timerDisplay.style.color = '#e74c3c'; 
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            window.removeEventListener('devicemotion', handleMotion);
            
            document.getElementById('game-container').style.display = 'none';
            const gameOverScreen = document.getElementById('game-over-screen');
            gameOverScreen.style.display = 'flex';
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-list').innerText = correctWordsList.length > 0 ? correctWordsList.join(', ') : "None";
            document.getElementById('skipped-list').innerText = skippedWordsList.length > 0 ? skippedWordsList.join(', ') : "None";
        }
    </script>

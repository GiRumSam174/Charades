<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sensor Charades v1.17</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            user-select: none; 
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }

        #word-display {
            font-size: 5rem;
            font-weight: bold;
            padding: 20px;
            text-transform: uppercase;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
        }

        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: #f39c12;
        }

        #sensor-status {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #e74c3c;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        #game-over-screen h2 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .list-container {
            width: 90%;
            max-width: 600px;
            text-align: left;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .word-list {
            font-size: 0.85rem; 
            white-space: nowrap; 
            overflow-x: auto; 
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin: 0;
            -webkit-overflow-scrolling: touch; 
        }

        .correct-color { color: #2ecc71; }
        .pass-color { color: #e74c3c; }

        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .correct { background-color: #2ecc71 !important; }
        .pass { background-color: #e74c3c !important; }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1>SENSOR CHARADES</h1>
        <p>Hold phone to forehead in Landscape.</p>
        <p>Tilt UP (Ceiling) for Correct | Tilt DOWN (Floor) to Pass</p>
        <button onclick="startGame()">START GAME</button>
        <div style="position: absolute; bottom: 10px; font-size: 0.8rem; color: #7f8c8d;">v1.17</div>
    </div>

    <div id="game-container" style="display: none;">
        <div id="score">Score: 0</div>
        <div id="timer">Time: 90</div> 
        <div id="word-display">READY?</div>
        <div id="sensor-status">Sensors: Waiting... (Must be HTTPS)</div>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1>TIME'S UP!</h1>
        <h2>Final Score: <span id="final-score">0</span></h2>
        
        <div class="list-container">
            <div class="list-title correct-color">Got It:</div>
            <div id="correct-list" class="word-list correct-color"></div>
        </div>

        <div class="list-container">
            <div class="list-title pass-color">Skipped:</div>
            <div id="skipped-list" class="word-list pass-color"></div>
        </div>

        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }

        const words = [
            "Pizza", "Elephant", "Moonwalk", "Superhero", "Sneeze", "Taco", "Surfing", "Guitar", "Dentist", "Gorilla",
            "Basketball", "Chef", "Submarine", "Spider-Man", "Washing Machine", "Yoga", "Butterfly", "Ice Cream", "Zebra", "Airplane",
            "Fishing", "Harry Potter", "Roller Coaster", "Robot", "Statue of Liberty", "Lawn Mower", "Ballet", "Pirate", "Firefighter", "Popcorn",
            "Crying", "Baking", "Driving", "Hiking", "Skiing", "Knitting", "Singing", "Boxing", "Climbing", "Painting",
            "Doctor", "Teacher", "Astronaut", "Farmer", "Pilot", "Mechanic", "Waiter", "Lawyer", "Scientist", "Artist",
            "Lion", "Penguin", "Giraffe", "Snake", "Monkey", "Kangaroo", "Dolphin", "Octopus", "Chicken", "Rabbit",
            "London", "Paris", "New York", "Beach", "Mountain", "Forest", "Desert", "Space", "Library", "Hospital",
            "Star Wars", "Disney", "Netflix", "TikTok", "YouTube", "iPhone", "Superman", "Batman", "Wonder Woman", "Joker",
            "Bowling", "Tennis", "Soccer", "Baseball", "Swimming", "Cycling", "Archery", "Karate", "Surfing", "Golf",
            "Laptop", "Headphones", "Camera", "Watch", "Umbrella", "Backpack", "Sunglasses", "Guitar", "Piano", "Drums",
            "Coffee", "Burger", "Sushi", "Donut", "Spaghetti", "Watermelon", "Carrot", "Chocolate", "Pineapple", "Sandwich",
            "Waking Up", "Brushing Teeth", "Showering", "Sleeping", "Running", "Dancing", "Jumping", "Laughing", "Whispering", "Clapping",
            "The Matrix", "Titanic", "Avatar", "Frozen", "Shrek", "Lion King", "Toy Story", "Iron Man", "Black Panther", "Thor",
            "Eiffel Tower", "Great Wall of China", "Pyramids", "Big Ben", "Grand Canyon", "Mount Everest", "Amazon River", "Antarctica", "Mars", "Saturn",
            "Rain", "Snow", "Thunder", "Rainbow", "Wind", "Sunshine", "Cloud", "Tornado", "Earthquake", "Volcano",
            "Cinderella", "Snow White", "Pikachu", "Mickey Mouse", "Bugs Bunny", "SpongeBob", "Scooby Doo", "Bart Simpson", "Mario", "Sonic",
            "Halloween", "Christmas", "Birthday", "Wedding", "Graduation", "Party", "Vacation", "Weekend", "Monday", "Summer",
            "Red", "Blue", "Green", "Yellow", "Purple", "Orange", "Pink", "Black", "White", "Gold",
            "Square", "Circle", "Triangle", "Star", "Heart", "Diamond", "Hexagon", "Cylinder", "Cube", "Sphere",
            "Book", "Pen", "Paper", "Scissors", "Key", "Wallet", "Phone", "Mirror", "Hammer", "Flashlight",
            "Jurassic Park", "The Lord of the Rings", "Back to the Future", "Jaws", "Ghostbusters", "E.T.", 
            "Indiana Jones", "The Terminator", "Gladiator", "Finding Nemo", "The Incredibles", "Pulp Fiction", 
            "Forrest Gump", "Men in Black", "Home Alone", "Willy Wonka", "The Wizard of Oz", "Pirates of the Caribbean",
            "Mean Girls", "The Avengers", "Jumanji", "Despicable Me", "Grease", "The Hunger Games", "Twilight",
            "Walking the Dog", "Doing Laundry", "Taking out the Trash", "Parallel Parking", "Riding a Unicycle", 
            "Juggling", "Getting a Haircut", "Mowing the Lawn", "Painting the Mona Lisa", "Winning the Lottery", 
            "Stubbing Your Toe", "Caught in the Rain", "Blowing out Candles", "Flipping a Pancake", "Stepping on a Lego", 
            "Singing in the Shower", "Arm Wrestling", "Changing a Diaper", "Riding a Mechanical Bull", "Walking a Tightrope",
            "Biting Your Nails", "Scrolling on Phone", "Taking a Selfie", "Putting on Makeup", "Tying Your Shoes",
            "Unicorn", "T-Rex", "Vampire", "Zombie", "Mermaid", "Sloth", "Chameleon", "Raccoon", "Flamingo", "Owl",
            "Godzilla", "King Kong", "Darth Vader", "Sherlock Holmes", "James Bond", "Frankenstein", "Dracula", "Ninja", "Samurai", "Centaur",
            "Building a Snowman", "Making a Pizza", "Trying to Fly", "Catching a Ghost", "Fighting a Bear", 
            "Defusing a Bomb", "Sneezing with Eyes Open", "Walking on the Moon", "Surfing a Tsunami", "Wrestling an Alligator",
            "Toilet Paper", "Magic Wand", "Boombox", "Hoverboard", "Lightsaber", 
            "Time Machine", "Bungee Cord", "Pogo Stick", "Fidget Spinner", "VR Headset"
        ];

        let score = 0;
        let timeLeft = 90; 
        let gameActive = false;
        
        let isNeutral = false; 
        let isProcessing = false; 
        let sensorsConfirmed = false;
        
        let currentWord = "";
        let correctWordsList = [];
        let skippedWordsList = [];

        const wordDisplay = document.getElementById('word-display');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const sensorStatus = document.getElementById('sensor-status');
        const container = document.getElementById('game-container');
        
        // --- HYBRID AUDIO SETUP ---
        let audioCtx;
        
        // Reference the external MP3 files
        const mp3Correct = new Audio('ding-correct.mp3');
        const mp3Pass = new Audio('buzzer-wrong.mp3');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // The Backup Synthesizer
        function playSynth(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        function playSound(type) {
            const audioFile = type === 'correct' ? mp3Correct : mp3Pass;
            
            // Clone the audio node to allow for rapid replays and prevent Android bugs
            const clone = audioFile.cloneNode();
            const playPromise = clone.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // If the file is missing (404) or blocked, fall back to the synth immediately!
                    console.log("MP3 Playback failed, falling back to synthesizer.", error);
                    playSynth(type);
                });
            } else {
                playSynth(type);
            }
        }

        function nextWord() {
            if (words.length === 0) return "Game Over!";
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words.splice(randomIndex, 1)[0]; 
            wordDisplay.innerText = currentWord;
            isProcessing = false; 
        }

        function handleGuess(type) {
            if (isProcessing) return;
            isProcessing = true;
            isNeutral = false; 

            if (type === 'correct') {
                score++;
                correctWordsList.push(currentWord); 
                scoreDisplay.innerText = `Score: ${score}`;
                container.classList.add('correct');
                playSound('correct');
            } else {
                skippedWordsList.push(currentWord); 
                container.classList.add('pass');
                playSound('pass');
            }

            setTimeout(() => {
                container.classList.remove('correct', 'pass');
                nextWord();
            }, 500);
        }

        function handleMotion(event) {
            let z = event.accelerationIncludingGravity ? event.accelerationIncludingGravity.z : null;
            
            if (!sensorsConfirmed && z !== null) {
                sensorsConfirmed = true;
                sensorStatus.innerText = "Sensors: Active!";
                sensorStatus.style.color = "#2ecc71";
            }

            if (!gameActive || isProcessing || z === null) return; 

            if (Math.abs(z) < 4) {
                isNeutral = true;
            } 
            else if (z > 7.5 && isNeutral) {
                handleGuess('correct');
            } else if (z < -7.5 && isNeutral) {
                handleGuess('pass');
            }
        }

        async function startGame() {
            initAudio(); 

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') return alert("Sensor Permission Denied!");
                } catch (e) { console.error(e); }
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            let countdown = 3;
            wordDisplay.innerText = countdown;
            timerDisplay.innerText = `Time: 90`;
            timerDisplay.style.color = '#f39c12';
            
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    wordDisplay.innerText = countdown;
                } else if (countdown === 0) {
                    wordDisplay.innerText = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    startActualGame();
                }
            }, 1000);
        }

        function startActualGame() {
            score = 0;
            timeLeft = 90; 
            gameActive = true;
            isNeutral = false; 
            
            correctWordsList = [];
            skippedWordsList = [];
            
            scoreDisplay.innerText = `Score: ${score}`;
            nextWord();

            window.addEventListener('devicemotion', handleMotion);

            const timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `Time: ${timeLeft}`;
                
                if (timeLeft <= 5) {
                    timerDisplay.style.color = '#e74c3c'; 
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            window.removeEventListener('devicemotion', handleMotion);
            
            document.getElementById('game-container').style.display = 'none';
            const gameOverScreen = document.getElementById('game-over-screen');
            gameOverScreen.style.display = 'flex';
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-list').innerText = correctWordsList.length > 0 ? correctWordsList.join(', ') : "None";
            document.getElementById('skipped-list').innerText = skippedWordsList.length > 0 ? skippedWordsList.join(', ') : "None";
        }
    </script>
</body>
</html>
